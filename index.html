<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="color-scheme" content="dark">
<title>Lista da Feira</title>
</head>
<body>
<div class="app" id="app">
  <section id="homeView">
    <div class="home-top">
      <div class="home-sub" id="homeSub" hidden></div>
      <label class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="search" placeholder="Procurar listas ou itens" autocomplete="off" aria-label="Procurar listas ou itens">
      </label>
      <div class="home-actions">
      <button class="iconbtn" id="catsBtn" aria-label="Editar categorias">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12.2V4.5a1 1 0 0 1 1-1h7.7l8.3 8.3a1.4 1.4 0 0 1 0 2l-6.2 6.2a1.4 1.4 0 0 1-2 0z"/><circle cx="8" cy="8" r="1.5"/></svg>
      </button>
      <button class="avatar-btn" id="profileBtn" aria-label="Perfil e ambientes"><span id="avatarInitial">·</span></button>
      </div>
    </div>
    <div id="homeBody"><div class="loading">Carregando suas listas…</div></div>
  </section>

  <section id="listView" hidden>
    <div class="lhead">
      <button class="iconbtn" id="backBtn" aria-label="Voltar para as listas">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <input class="title-in" id="titleInput" placeholder="Nome da lista" autocomplete="off" aria-label="Nome da lista" enterkeyhint="done">
      <div class="peers" id="peers"></div>
      <button class="iconbtn" id="menuBtn" aria-label="Mais opções da lista">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
      </button>
    </div>
    <div class="lmeta">
      <span class="shop-pill" id="shopPill" hidden title="Você recebe um aviso quando alguém adicionar itens">modo compra</span>
      <div class="pbar"><i id="pbarFill" style="width:0"></i></div>
      <div class="progress" id="progress">0/0</div>
    </div>
    <div id="listBanner"></div>
    <div id="suggest"></div>
    <div class="cats-wrap" id="catsWrap"></div>
    <div id="listEmpty"></div>
    <section class="cat cart" id="cartSec" hidden>
      <button class="sect-toggle" id="cartToggle" aria-expanded="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        <span id="cartLabel">No carrinho</span>
      </button>
      <ul class="items" id="cartList"></ul>
    </section>
  </section>
</div>

<button class="fab" id="fab" aria-label="Nova lista" hidden>
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="addbar" id="addbar" hidden>
  <div class="addbar-in">
    <button class="catchip auto" id="addCat" aria-label="Escolher categoria"><i class="sw"></i><span>Outros</span></button>
    <input id="addInput" placeholder="Adicionar itens (ex.: arroz, leite e pão)" autocomplete="off" enterkeyhint="send" aria-label="Adicionar itens">
    <button class="micbtn" id="addBtn" aria-label="Ditar itens por voz">
      <svg class="ic-mic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
          </button>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden><div class="handle"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="toastUndo" hidden>Desfazer</button></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
