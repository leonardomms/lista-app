<title>Lista da Feira</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
/* Layout: uma coluna estreita tipo app de celular; cards por lista, seções por categoria, barra de adicionar fixa embaixo. Dark-first (como o HyperOS), com tema claro. */
/* Visual único, escuro: preto com grade de pontinhos, cards de vidro fumê com borda fina e acento laranja com brilho. */
:root{
  --bg:#0a0a0b; --surface:rgba(24,23,24,.82); --surface-solid:#171617; --surface-2:#232123; --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.14);
  --fg:#f4f2ef; --muted:#9a948e; --faint:#5c5753;
  --dot:rgba(255,255,255,.075);
  --accent:#ff6b1a; --accent-2:#ff9a4d; --accent-ink:#140803; --accent-text:#ff8a3d; --accent-soft:rgba(255,107,26,.13);
  --glow:0 0 24px rgba(255,107,26,.35);
  --danger:#ff5a4e;
  --shadow:0 14px 40px rgba(0,0,0,.6);
  --display:"Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --body:"Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 1px, transparent 1.2px);background-size:18px 18px;background-attachment:fixed;color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:600px;margin:0 auto;padding-block:8px 140px;position:relative;z-index:1}
svg{display:block}

/* ---------- home ---------- */
.home-top{display:flex;align-items:center;gap:8px;padding:20px 0 18px}
h1{font-family:var(--display);font-weight:600;font-size:38px;letter-spacing:-.04em;margin:0;line-height:1}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--accent-2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.home-sub{color:var(--muted);font-family:var(--mono);font-size:12px;margin-top:10px;letter-spacing:.02em}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px;height:46px;flex:1;min-width:0}
.search svg{color:var(--muted);flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;height:100%}
.search input::placeholder{color:var(--muted)}
.lists{display:flex;flex-direction:column;gap:10px}
.lcard{display:grid;grid-template-columns:auto 1fr auto;align-items:start;gap:12px;background:linear-gradient(180deg,rgba(255,255,255,.035),transparent 60%),var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;position:relative;overflow:hidden;transition:transform .12s}
.lcard:active{transform:scale(.99)}
.lcard h2{font-size:17px;font-weight:600;margin:0;line-height:1.3;overflow-wrap:anywhere}
.lcard .prev{color:var(--muted);font-size:14px;margin:4px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.lcard .count{font-variant-numeric:tabular-nums;font-family:var(--mono);color:var(--muted);font-size:12px;padding-top:2px}
.lcard .cats{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
.lcard .cats i{width:8px;height:8px;border-radius:3px;background:var(--c)}
.lcard .bar{position:absolute;left:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--accent-2),var(--accent));box-shadow:var(--glow);transition:width .3s}
.lcard.done h2{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.sect-toggle{display:flex;align-items:center;gap:6px;color:var(--muted);font-family:var(--mono);font-size:12px;padding:22px 4px 10px;letter-spacing:.02em}
.sect-toggle svg{transition:transform .2s}
.sect-toggle[aria-expanded="false"] svg{transform:rotate(-90deg)}

.empty{text-align:center;padding:48px 24px;color:var(--muted)}
.empty .basket{width:72px;height:72px;margin:0 auto 16px;border-radius:24px;background:var(--surface);border:1px solid var(--line);box-shadow:0 0 40px rgba(255,107,26,.18);display:grid;place-items:center;color:var(--accent)}
.empty strong{display:block;color:var(--fg);font-size:18px;font-family:var(--display);margin-bottom:6px}

.fab{position:fixed;right:max(20px, calc(env(safe-area-inset-right,0px) + 20px));bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:var(--shadow),0 0 30px rgba(255,107,26,.45);z-index:20;transition:transform .15s}
.fab:active{transform:scale(.94)}
@media (min-width:640px){.fab{right:calc(50% - 300px + 4px)}}

/* ---------- list view ---------- */
.lhead{display:flex;align-items:center;gap:4px;padding:16px 0 4px;margin-left:-8px}
.lmeta{display:flex;align-items:center;gap:10px;margin:6px 2px 18px}
.lmeta .progress{padding-bottom:0}
.iconbtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--fg);flex:none}
.iconbtn:hover{background:var(--surface)}
.lhead .spacer{flex:1}
.peers{display:flex;align-items:center;flex:none}
.peer-stack{display:flex;align-items:center;padding:4px 6px 4px 14px;position:relative;border-radius:999px}
.peer-stack:hover{background:var(--surface)}
.peers .av.more-av{background:var(--surface-2);color:var(--fg);font-family:var(--mono);font-size:11px;font-weight:500}
.live-dot{position:absolute;right:3px;bottom:3px;width:10px;height:10px;border-radius:50%;background:#4fc37a;border:2px solid var(--bg)}
.peers .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#141210;border:2px solid var(--bg);margin-left:-8px;background:var(--c)}
.peers .live{font-size:12px;color:var(--muted);margin-left:8px;display:flex;align-items:center;gap:6px}
.peers .live::before{content:"";width:7px;height:7px;border-radius:50%;background:#4fc37a;box-shadow:0 0 0 3px rgba(79,195,122,.2)}
.title-row{display:flex;align-items:flex-end;gap:12px;padding:6px 2px 4px}
.title-in{flex:1;min-width:0;background:none;border:0;outline:none;font-family:var(--display);font-weight:600;font-size:26px;letter-spacing:-.03em;padding:6px 0;line-height:1.2;text-overflow:ellipsis}
.title-in::placeholder{color:var(--faint)}
.progress{font-variant-numeric:tabular-nums;font-family:var(--mono);color:var(--muted);font-size:13px;padding-bottom:6px;white-space:nowrap}
.pbar{height:4px;border-radius:4px;background:var(--surface-2);margin:0;flex:1;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent));box-shadow:var(--glow);border-radius:4px;transition:width .35s}

.banner{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border:1px solid rgba(255,107,26,.3);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.banner p{margin:0;flex:1}
.banner strong{display:block;font-size:15px}
.btn{height:38px;padding:0 14px;border-radius:11px;font-weight:600;font-size:14px;background:var(--surface-2);white-space:nowrap}
.btn.primary{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:var(--accent-ink);box-shadow:var(--glow);border-radius:999px}
.btn.danger{background:var(--danger);color:#fff}
.note{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:14px}

.cats-wrap{display:flex;flex-direction:column;gap:12px}
.cat{background:linear-gradient(180deg,rgba(255,255,255,.03),transparent 40%),var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 6px 8px}
.cat-head{display:flex;align-items:center;gap:8px;padding:8px 8px 4px 4px}
.cat-name{flex:1;display:flex;align-items:center;gap:6px;min-width:0;text-align:left;color:var(--muted);padding:4px 0}
.cat-name svg{opacity:.55;flex:none}
.cat-name h3{flex:none;min-width:0}
.cat-name:hover svg{opacity:1;color:var(--accent-text)}
.ro .cat-name{pointer-events:none}.ro .cat-name svg{display:none}
.cat-head h3{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.04em;text-transform:lowercase;color:var(--muted);flex:1}
.cat-head .n{font-family:var(--mono);font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.sw{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.cat-grip{color:var(--faint);cursor:grab;touch-action:none;padding:4px 2px;display:grid;place-items:center}
.add-in-cat{display:flex;align-items:center;gap:10px;width:100%;height:42px;padding:0 12px 0 36px;color:var(--muted);font-size:15px;border-radius:12px;text-align:left}
.add-in-cat:hover{color:var(--fg);background:rgba(255,255,255,.03)}
.add-in-cat svg{color:var(--accent)}
.ro .add-in-cat{display:none}
.catrows{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.catrow{display:flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:12px;padding:4px 4px 4px 6px}
.catrow .swbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.catrow .swbtn i{width:18px;height:18px;border-radius:6px;background:var(--c)}
.catrow .catname{flex:1;min-width:0;height:40px;background:none;border:0;border-bottom:1px solid transparent;outline:none;font-size:16px}
.catrow .catname:focus{border-bottom-color:var(--accent)}
.catrow .uses{font-family:var(--mono);font-size:12px;color:var(--faint);padding:0 4px}
.catrow .del{min-width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.catrow .del.arm{padding:0 12px;background:var(--danger);color:#fff;font-weight:600;font-size:13px}
.palette{display:flex;flex-wrap:wrap;gap:10px;padding:10px 8px 8px}
.palette button{width:30px;height:30px;border-radius:50%;background:var(--c)}
.palette button[aria-pressed="true"]{outline:2px solid var(--fg);outline-offset:2px}
.home-actions{display:flex;gap:2px}
.items{list-style:none;margin:0;padding:0;min-height:8px}
.item{display:flex;align-items:center;gap:4px;border-radius:12px;min-height:46px;background:transparent}
.item .grip{color:var(--faint);cursor:grab;touch-action:none;width:30px;height:44px;display:grid;place-items:center;flex:none}
.item .check{width:24px;height:24px;border-radius:50%;border:1.6px solid var(--faint);display:grid;place-items:center;flex:none;transition:background .15s,border-color .15s;margin-right:8px;position:relative}
.item .check::after{content:"";position:absolute;inset:-10px}
.item .check svg{opacity:0;color:var(--accent-ink);transform:scale(.6);transition:opacity .15s,transform .15s}
.item .check[aria-checked="true"]{background:var(--accent);border-color:var(--accent);box-shadow:0 0 12px rgba(255,107,26,.5)}
.item .check[aria-checked="true"] svg{opacity:1;transform:scale(1)}
.item .txt{flex:1;min-width:0;background:none;border:0;outline:none;padding:12px 0;font-size:16px}
.item .txt::placeholder{color:var(--faint)}
.item .more{width:40px;height:44px;display:grid;place-items:center;color:var(--faint);flex:none;border-radius:10px}
.item .more:hover{color:var(--fg)}
.item .txt{transition:color .25s}
.item.done:not(.settling) .check[aria-checked="true"]{background:var(--surface-2);border-color:var(--surface-2);box-shadow:none}
.item.done:not(.settling) .check[aria-checked="true"] svg{color:var(--muted)}
.item.done:not(.settling) .txt{color:var(--faint)}
.item .check{transition:background .35s,border-color .35s,box-shadow .35s}
.item.done .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.cat.all-done .cat-head h3{text-decoration:line-through;text-decoration-color:var(--faint)}
.item.done .grip{visibility:hidden}
.item .tag{font-size:11px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap;margin-right:2px}
.item .tag i{width:7px;height:7px;border-radius:2px;background:var(--c)}
.sortable-ghost{opacity:.35}
.sortable-chosen.item, .sortable-drag{background:var(--accent)!important;box-shadow:var(--shadow),var(--glow)}
.sortable-chosen.item .txt,.sortable-chosen.item .grip,.sortable-chosen.item .more{color:var(--accent-ink)}
.sortable-chosen.item .check{border-color:var(--accent-ink)}
.cat.sortable-ghost{opacity:.4}
.cats-wrap.reordering .cat .items,.cats-wrap.reordering .cat .add-in-cat,.cat.collapsed .items,.cat.collapsed .add-in-cat{display:none}
.cats-wrap.reordering .cat{padding-bottom:4px}
.cat.collapsed{padding-bottom:4px;background:transparent;border-style:dashed}
.cat-toggle{width:32px;height:32px;border-radius:10px;display:none;place-items:center;color:var(--muted);flex:none}
.cat.all-done .cat-toggle{display:grid}
.cat-toggle svg{transition:transform .2s}
.cat.collapsed .cat-toggle svg{transform:rotate(-90deg)}
.item.fresh{animation:fresh 2.4s ease-out}
@keyframes fresh{0%,30%{background:rgba(255,107,26,.22)}100%{background:transparent}}
.shop-pill{font-family:var(--mono);font-size:11px;color:var(--accent-text);border:1px solid rgba(255,107,26,.4);border-radius:999px;padding:3px 9px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.shop-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:var(--glow)}
.cart{margin-top:14px;background:transparent;border:0;padding:0}
.cart .cat-head{padding-left:8px}
.cart .items .item{background:transparent}

.ro .grip,.ro .cat-grip,.ro .more{display:none}
.ro .item .txt{pointer-events:none}

/* add bar */
.addbar{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:10px max(16px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px, env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.addbar-in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:8px;background:rgba(28,26,27,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:999px;padding:6px;box-shadow:var(--shadow),0 0 40px rgba(255,107,26,.12);border:1px solid var(--line-strong)}
.addbar-in:focus-within{border-color:rgba(255,107,26,.5)}
#addInput{caret-color:var(--accent)}
.catchip{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:600;white-space:nowrap;max-width:44%;flex:none}
.catchip span{overflow:hidden;text-overflow:ellipsis}
.catchip.auto::after{content:"auto";font-family:var(--mono);font-size:10px;color:var(--accent-text);font-weight:500;letter-spacing:.04em}
#addInput{flex:1;min-width:0;background:none;border:0;outline:none;height:40px;padding:0 4px}
#addInput::placeholder{color:var(--muted)}
.micbtn{width:40px;height:40px;border-radius:50%;background:var(--surface-2);color:var(--fg);display:grid;place-items:center;flex:none;transition:background .2s,color .2s}
.micbtn.listening{background:var(--accent);color:var(--accent-ink);animation:listen 1.2s ease-in-out infinite}
@keyframes listen{0%,100%{box-shadow:0 0 0 0 rgba(255,107,26,.5)}50%{box-shadow:0 0 0 8px rgba(255,107,26,0)}}
.addbtn{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);box-shadow:var(--glow);display:grid;place-items:center;flex:none}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:600px;margin:0 auto;background:var(--surface-solid);border:1px solid var(--line-strong);border-bottom:0;border-radius:24px 24px 0 0;padding:10px max(18px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(18px, env(safe-area-inset-left,0px));transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-height:85vh;overflow:auto}
.sheet.on{transform:none}
.sheet .handle{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.sheet h4{font-family:var(--display);font-size:20px;margin:0 0 4px;overflow-wrap:anywhere}
.sheet .sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.catgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.catopt{display:flex;align-items:center;gap:10px;height:46px;padding:0 12px;border-radius:12px;background:var(--surface-2);font-weight:500;font-size:15px;text-align:left;min-width:0}
.catopt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catopt[aria-pressed="true"]{outline:2px solid var(--accent);background:var(--accent-soft)}
.newcat{display:flex;gap:8px;margin-bottom:12px}
.newcat input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line-strong);background:var(--bg);padding:0 12px;outline:none}
.newcat input:focus{border-color:var(--accent)}
.menu{display:flex;flex-direction:column;gap:2px}
.menu button{display:flex;align-items:center;gap:14px;height:52px;padding:0 10px;border-radius:12px;text-align:left;font-size:16px}
.menu button:hover{background:var(--surface-2)}
.menu button svg{color:var(--muted)}
.menu .red{color:var(--danger)}
.menu .red svg{color:var(--danger)}
.confirm{display:flex;gap:8px;margin-top:12px}
.confirm .btn{flex:1;height:46px}
.help p{margin:0 0 12px;font-size:15px;color:var(--fg)}
.help ol{margin:0 0 12px;padding-left:20px;font-size:15px}
.help li{margin-bottom:8px}
.help .muted{color:var(--muted);font-size:14px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translate(-50%,20px);background:var(--fg);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:500;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.sheet.on ~ .toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 16px)}
.toast button{color:#d34f05;font-weight:700;padding:6px 8px}
.finish{text-align:center;padding:36px 12px 28px}
.finish .ring{width:96px;height:96px;border-radius:50%;margin:0 auto 22px;background:linear-gradient(180deg,var(--accent-2),var(--accent));display:grid;place-items:center;color:var(--accent-ink);box-shadow:0 0 70px rgba(255,107,26,.55);animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.finish h2{font-family:var(--display);font-weight:600;font-size:30px;letter-spacing:-.035em;margin:0 0 8px}
.finish h2 em{font-style:normal;color:var(--accent-text)}
.finish p{color:var(--muted);margin:0 auto;max-width:34ch;font-size:15px}
.finish-actions{display:flex;flex-direction:column;align-items:center;gap:10px;margin:26px 0 18px}
.finish-actions .btn{height:46px;min-width:230px;border-radius:999px;font-size:15px}
.finish-actions .btn.ghost{background:none;color:var(--muted)}
.finish .hint{font-family:var(--mono);font-size:12px;color:var(--faint)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.suggest{border:1px dashed rgba(255,107,26,.38);border-radius:16px;padding:12px;margin-bottom:14px;background:linear-gradient(180deg,rgba(255,107,26,.07),transparent 70%)}
.sg-head{display:flex;align-items:center;gap:4px;margin-bottom:10px}
.sg-title{flex:1;display:flex;gap:7px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--accent-text);min-width:0;white-space:nowrap;overflow:hidden}
.sg-title svg{flex:none}
.sg-head button{font-size:13px;color:var(--muted);padding:6px 8px;border-radius:8px;white-space:nowrap}
.sg-head button:hover{color:var(--fg)}
.sg-head [data-act="sg-all"]{color:var(--accent-text);font-weight:600}

<script>
(function(){
"use strict";

/* ---------------- categorias ---------------- */
const DEFAULT_CATS = [
  {id:"fruteira",   name:"Fruteira",          color:"#6cc25a"},
  {id:"padaria",    name:"Padaria",           color:"#e0a35c"},
  {id:"acougue",    name:"Açougue",           color:"#e2675c"},
  {id:"frios",      name:"Frios e laticínios",color:"#7fb4ea"},
  {id:"mercearia",  name:"Mercearia",         color:"#c29be3"},
  {id:"congelados", name:"Congelados",        color:"#5ccbcb"},
  {id:"bebidas",    name:"Bebidas",           color:"#ec90b8"},
  {id:"limpeza",    name:"Limpeza",           color:"#8e9cf3"},
  {id:"higiene",    name:"Higiene",           color:"#66d0a0"},
  {id:"pet",        name:"Pet",               color:"#e8bf55"},
  {id:"outros",     name:"Outros",            color:"#9e978b"}
];
const EXTRA_COLORS = ["#f08a5d","#b8de6f","#6fb1de","#de6fb1","#d8c35a","#7ad6c0","#a98be6"];

const KW = {
  fruteira:"banana maca laranja limao uva mamao manga abacaxi melancia melao morango pera kiwi abacate tomate alface cebola alho batata cenoura beterraba pepino abobrinha abobora brocolis couve repolho pimentao chuchu mandioca aipim inhame salsinha cebolinha coentro rucula espinafre berinjela gengibre ovo ovos tangerina mexerica bergamota goiaba maracuja coco ameixa pessego quiabo vagem jilo agriao hortela manjericao salsa cheiro-verde fruta frutas verdura verduras legume legumes",
  padaria:"pao paes baguete bisnaga croissant bolo sonho rosca torrada broa sovado ciabatta brioche",
  acougue:"carne carnes frango peito coxa coxinha sobrecoxa file patinho alcatra picanha costela linguica moida acem maminha cupim lombo pernil bisteca porco suino peixe salmao tilapia camarao fraldinha contrafile musculo coracao asa asinha bife",
  frios:"queijo presunto mussarela mucarela muzzarela mortadela salame iogurte leite manteiga margarina requeijao nata bacon parmesao ricota cottage blanquet",
  mercearia:"arroz feijao macarrao massa oleo azeite acucar sal farinha cafe molho extrato milho ervilha atum sardinha biscoito bolacha cereal aveia granola fuba tempero vinagre maionese ketchup mostarda chocolate achocolatado gelatina mel geleia pipoca lentilha grao-de-bico amendoim castanha farofa tapioca polvilho fermento adocante cha-mate",
  congelados:"sorvete pizza lasanha nuggets hamburguer polpa congelado congelada empanado",
  bebidas:"agua refrigerante refri coca suco cerveja vinho energetico guarana cha kombucha espumante vodka cachaca isotonico",
  limpeza:"detergente sabao amaciante desinfetante cloro esponja vassoura lixo alcool multiuso limpador lustra-moveis veja pano rodo luva",
  higiene:"shampoo xampu condicionador sabonete desodorante absorvente fralda fraldas cotonete barbear lamina gilete hidratante protetor escova enxaguante",
  pet:"racao areia petisco sache coleira"
};
const KW_PHRASES = [
  ["papel higienico","higiene"],["creme dental","higiene"],["pasta de dente","higiene"],["fio dental","higiene"],
  ["papel toalha","limpeza"],["agua sanitaria","limpeza"],["saco de lixo","limpeza"],["sabao em po","limpeza"],
  ["creme de leite","mercearia"],["leite condensado","mercearia"],["pao de queijo","congelados"],["peito de peru","frios"],
  ["batata frita","congelados"],["agua de coco","bebidas"],["leite de coco","mercearia"],["carne moida","acougue"],
  ["pao de forma","padaria"],["pao frances","padaria"],["queijo ralado","frios"]
];
const KW_MAP = new Map();
for (const [cat, words] of Object.entries(KW)) for (const w of words.split(/\s+/)) if (!KW_MAP.has(w)) KW_MAP.set(w.replace(/-/g," "), cat);

function norm(s){ return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim(); }
const STOP = ["kg","g","un","l","ml","de","do","da","pct","cx","dz","duzia"];
function keyOf(text){ return norm(text).split(" ").filter(x => x && !/^\d/.test(x) && !STOP.includes(x)).join(" "); }
function learnedCat(text){
  const k = keyOf(text); if (!k) return null;
  const L = S.learned || {};
  const hit = L[k] || (k.endsWith("s") ? L[k.slice(0,-1)] : null) || L[k + "s"];
  return hit && allCats().some(c => c.id === hit) ? hit : null;
}
function guessCat(text){ return learnedCat(text) || builtinCat(text); }
/* dividir uma frase ditada/digitada em vários itens (sem IA: separadores + dicionário) */
const QTY_RE = /^(\d+([.,]\d+)?x?|meia|meio|um|uma|dois|duas|tres|quatro|cinco|seis|sete|oito|nove|dez|doze)$/;
const UNITS = new Set(["kg","g","gr","l","ml","litro","litros","pacote","pacotes","pct","caixa","caixas","cx","lata","latas","garrafa","garrafas","unidade","unidades","un","duzia","duzias","maco","macos","bandeja","bandejas","pote","potes","saco","sacos","vidro","vidros","rolo","rolos","fardo","fardos"]);
const GLUE = new Set(["de","do","da","dos","das","com","sem","para","pra"]);
let PHRASES = null;
function phraseSet(){
  if (!PHRASES) { PHRASES = new Set(KW_PHRASES.map(x => x[0])); for (const k of KW_MAP.keys()) if (k.includes(" ")) PHRASES.add(k); }
  return PHRASES;
}
function knownWord(w){
  const n = norm(w); if (!n) return false;
  if (KW_MAP.has(n) || (n.endsWith("s") && KW_MAP.has(n.slice(0,-1))) || (n.endsWith("es") && KW_MAP.has(n.slice(0,-2))) || (n.endsWith("oes") && KW_MAP.has(n.slice(0,-3) + "ao"))) return true;
  return !!learnedCat(w);
}
function segmentKnown(part){
  const words = part.split(" ").filter(Boolean);
  if (words.length < 2) return [part];
  const out = []; let pre = []; let i = 0;
  while (i < words.length) {
    const n = norm(words[i]);
    if (QTY_RE.test(n) || UNITS.has(n)) { pre.push(words[i]); i++; continue; }
    if (GLUE.has(n)) {
      if (pre.length) { pre.push(words[i]); i++; continue; }
      if (out.length && i + 1 < words.length) { out[out.length - 1] += " " + words[i] + " " + words[i + 1]; i += 2; continue; }
      return [part];
    }
    let took = 0;
    for (const len of [4, 3, 2]) {
      if (i + len > words.length) continue;
      const chunk = words.slice(i, i + len).join(" ");
      if (phraseSet().has(norm(chunk)) || learnedCat(chunk)) { took = len; break; }
    }
    if (!took && knownWord(words[i])) took = 1;
    if (!took) {
      // palavra desconhecida logo após um item é complemento dele ("macarrão integral", "sabão em pó")
      if (out.length && !pre.length) { out[out.length - 1] += " " + words[i]; i++; continue; }
      return [part];                 // começa com palavra desconhecida: melhor não arriscar dividir
    }
    out.push(pre.concat(words.slice(i, i + took)).join(" ")); pre = []; i += took;
  }
  if (pre.length) { if (!out.length) return [part]; out[out.length - 1] += " " + pre.join(" "); }
  return out.length ? out : [part];
}
function splitItems(text){
  const t = String(text || "").replace(/\s+/g, " ").trim(); if (!t) return [];
  const parts = t.split(/\s*[,;\n]\s*|\s+(?:e|mais|tamb[eé]m)\s+/i).map(x => x.replace(/^[\s\-•*·.]+|[\s.]+$/g, "").trim()).filter(Boolean);
  const out = [];
  for (const part of parts) out.push(...segmentKnown(part));
  return out.map(x => x.charAt(0).toLowerCase() === x.charAt(0) ? x : x.charAt(0).toLowerCase() + x.slice(1)).filter(Boolean);
}
function learn(text, cat){
  const k = keyOf(text); if (!k || !cat || S.readonly) return;
  const L = S.learned || {};
  if (L[k] === cat) return;
  if (!L[k] && builtinCat(text) === cat) return;
  S.learned = {...L, [k]: cat};
  writeLearned();
  toast(`Aprendi: “${k}” vai para ${catById(cat).name}`);
}
function writeLearned(){
  if (S.mode !== "remote") { saveLocal(); return; }
  const body = {map: S.learned};
  enqueue(envPath("config/learned"), () => S.db.doc(envPath("config/learned")).set(body)).catch(onWriteError);
}
function builtinCat(text){
  const t = norm(text); if (!t) return null;
  for (const [p,c] of KW_PHRASES) if (t.includes(p)) return c;
  const toks = t.split(" ").filter(x => x && !/^\d/.test(x) && !["kg","g","un","l","ml","de","do","da","pct","cx","dz","duzia"].includes(x));
  for (const tok of toks){
    if (KW_MAP.has(tok)) return KW_MAP.get(tok);
    if (tok.endsWith("s") && KW_MAP.has(tok.slice(0,-1))) return KW_MAP.get(tok.slice(0,-1));
    if (tok.endsWith("es") && KW_MAP.has(tok.slice(0,-2))) return KW_MAP.get(tok.slice(0,-2));
    if (tok.endsWith("oes") && KW_MAP.has(tok.slice(0,-3)+"ao")) return KW_MAP.get(tok.slice(0,-3)+"ao");
  }
  return null;
}

/* ---------------- estado ---------------- */
const S = {
  mode:"loading", db:null, userApi:null, room:null,
  lists:new Map(), items:new Map(), history:new Map(), customCats:[], catOverrides:{}, learned:{},
  loaded:{lists:false, items:false},
  view:"home", listId:null, search:"", showDone:false, showCart:true,
  readonly:false, peers:[], profiles:{}, dragging:false, pendingRender:false,
  addCat:null, addCatManual:false
};
const shopping = new Set();     // listas em modo compra (alguém riscou um item nesta sessão)
const myCreated = new Set();
const pendingBlank = new Set();
const expanded = new Set();     // categorias concluídas que o usuário abriu
const hold = new Map();        // itemId -> estado anterior, mantém a posição por um instante após riscar
const holdTimers = new Map();
const drafts = new Map();      // itemId -> texto ainda não salvo
const draftTimers = new Map();
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function allCats(){
  const ov = S.catOverrides || {};
  const base = DEFAULT_CATS.filter(c => !(ov[c.id] && ov[c.id].deleted && c.id !== "outros")).map(c => {
    const o = ov[c.id]; if (!o) return c;
    return {...c, name: o.name || c.name, color: o.color || c.color};
  });
  return base.concat(S.customCats.filter(c => c && c.id && !DEFAULT_CATS.some(d => d.id === c.id)));
}
function catById(id){ const all = allCats(); return all.find(c => c.id === id) || all.find(c => c.id === "outros") || DEFAULT_CATS[DEFAULT_CATS.length-1]; }
const PALETTE = [...new Set(DEFAULT_CATS.map(c => c.color).concat(EXTRA_COLORS))];
function itemsOf(listId){ const out=[]; for (const [id,it] of S.items) if (it.listId === listId) out.push({id, ...it}); return out; }
function sortedCatsFor(list){
  const base = allCats().map(c=>c.id);
  const ord = Array.isArray(list && list.catOrder) ? list.catOrder.filter(id => base.includes(id)) : [];
  return ord.concat(base.filter(id => !ord.includes(id)));
}

/* ---------------- persistência ---------------- */
const LS_KEY = "lista-feira-local-v1";
function saveLocal(){
  try { localStorage.setItem(lsKey(), JSON.stringify({lists:[...S.lists], items:[...S.items], customCats:S.customCats, catOverrides:S.catOverrides, learned:S.learned, history:[...S.history]})); } catch(e){}
}
function loadLocal(){
  try {
    const raw = localStorage.getItem(lsKey()); if (!raw) return;
    const d = JSON.parse(raw);
    S.lists = new Map(d.lists||[]); S.items = new Map(d.items||[]); S.customCats = d.customCats||[]; S.catOverrides = d.catOverrides||{}; S.learned = d.learned||{}; S.history = new Map(d.history||[]);
  } catch(e){}
}
const queues = new Map();
function enqueue(path, fn){
  const prev = queues.get(path) || Promise.resolve();
  const p = prev.catch(()=>{}).then(fn);
  queues.set(path, p);
  p.finally(() => { if (queues.get(path) === p) queues.delete(path); }).catch(()=>{});
  return p;
}
function newId(){
  if (S.mode === "remote") { try { return S.db.collection("items").doc().id; } catch(e){} }
  return "x" + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}
function apply(coll, id, data, mode){
  const m = coll === "lists" ? S.lists : coll === "history" ? S.history : S.items;
  if (mode === "del") m.delete(id);
  else if (mode === "set") m.set(id, {...data});
  else m.set(id, {...(m.get(id)||{}), ...data});
}
function write(coll, id, data, mode){
  if (S.readonly) return Promise.resolve();
  apply(coll, id, data, mode);
  render();
  if (S.mode !== "remote") { saveLocal(); return Promise.resolve(); }
  const ref = S.db.collection(envPath(coll)).doc(id);
  return enqueue(coll + "/" + id, () => mode === "del" ? ref.delete() : mode === "set" ? ref.set(data) : ref.update(data))
    .catch(onWriteError);
}
function writeCats(){
  if (S.readonly) return;
  render();
  if (S.mode !== "remote") { saveLocal(); return; }
  const body = {list:S.customCats, overrides:S.catOverrides};
  enqueue(envPath("config/categories"), () => S.db.doc(envPath("config/categories")).set(body)).catch(onWriteError);
}
function patchCat(id, patch){
  if (S.readonly) return;
  if (S.customCats.some(c => c.id === id)) S.customCats = S.customCats.map(c => c.id === id ? {...c, ...patch} : c);
  else S.catOverrides = {...S.catOverrides, [id]: {...(S.catOverrides[id]||{}), ...patch}};
  writeCats();
}
function deleteCat(id){
  if (S.readonly || id === "outros") return 0;
  const moved = []; for (const [iid, it] of S.items) if (it.cat === id) moved.push(iid);
  moved.forEach(iid => write("items", iid, {cat:"outros"}, "patch"));
  if (S.customCats.some(c => c.id === id)) S.customCats = S.customCats.filter(c => c.id !== id);
  else S.catOverrides = {...S.catOverrides, [id]: {...(S.catOverrides[id]||{}), deleted:true}};
  writeCats();
  return moved.length;
}
function onWriteError(e){
  const code = e && e.code;
  if (code === "quota_exceeded") toast("O armazenamento está cheio. Apague listas antigas para liberar espaço.");
  else if (code === "invalid_argument") toast("Não deu para salvar essa alteração. Talvez você só tenha acesso de leitura.");
  else if (code === "revoked") { S.readonly = true; render(); }
  else toast("Sem conexão no momento. Tente de novo em instantes.");
}

/* ---------------- render ---------------- */
function render(){
  if (S.dragging) { S.pendingRender = true; return; }
  document.body.classList.toggle("ro", S.readonly);
  const ini = (S.meName||"").trim().split(/\s+/).filter(Boolean).map(w=>w[0]).join("").slice(0,2).toUpperCase();
  $("profileBtn").classList.toggle("has-dot", !!S.fbUnread);
  $("avatarInitial").textContent = ini || (envName(S.env)||"·").trim().charAt(0).toUpperCase() || "·";
  $("homeView").hidden = S.view !== "home";
  $("listView").hidden = S.view !== "list";
  $("fab").hidden = S.view !== "home" || S.readonly || S.mode === "loading";
  $("addbar").hidden = S.view !== "list" || S.readonly;
  if (S.view === "home") renderHome(); else renderList();
}

function renderHome(){
  const body = $("homeBody");
  if (S.mode === "remote" && S.bootDone && !S.env) {
    $("homeSub").textContent = "Nenhum ambiente ainda";
    body.innerHTML = `<div class="empty"><div class="basket">${ICON_BASKET}</div><strong>Entre num ambiente</strong>Peça o link de convite para quem criou a lista.<div style="margin-top:16px"><button class="btn primary" data-act="join-code">Colar link de convite</button></div></div>`;
    return;
  }
  if (S.mode === "loading" || (S.mode === "remote" && !(S.loaded.lists && S.loaded.items))) {
    body.innerHTML = `<div class="loading">${S.migrating ? "Organizando suas listas no ambiente “Minha casa”…" : "Carregando suas listas…"}</div>`; return;
  }
  const q = norm(S.search);
  const all = [...S.lists].map(([id,l]) => ({id, ...l}))
    .sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
  const match = l => {
    if (!q) return true;
    if (norm(l.title).includes(q)) return true;
    return itemsOf(l.id).some(i => norm(i.text).includes(q));
  };
  const active = all.filter(l => !l.done && match(l));
  const done = all.filter(l => l.done && match(l));
  const sub = $("homeSub");
  const openCount = all.filter(l=>!l.done).length;
  sub.textContent = envName(S.env) + " · " + (S.mode === "local" ? "modo local, só neste aparelho" :
    openCount ? (openCount === 1 ? "1 lista aberta" : openCount + " listas abertas") : "nenhuma lista aberta");

  if (!all.length) {
    body.innerHTML = `<div class="empty"><div class="basket">${ICON_BASKET}</div><strong>Nenhuma lista ainda</strong>${S.readonly ? "Quando alguém criar uma lista, ela aparece aqui." : "Toque no + para criar a primeira lista de compras."}<div style="margin-top:18px"><button class="btn" data-act="join-code">Recebeu um convite? Cole o link</button></div></div>`;
    return;
  }
  let html = "";
  if (!active.length && !done.length) html += `<div class="empty">Nada encontrado para “${esc(S.search)}”.</div>`;
  html += `<div class="lists">${active.map(cardHTML).join("")}</div>`;
  if (done.length) {
    html += `<button class="sect-toggle" data-act="toggle-done" aria-expanded="${S.showDone}">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      Concluídas · ${done.length}</button>`;
    if (S.showDone) html += `<div class="lists">${done.map(cardHTML).join("")}</div>`;
  }
  body.innerHTML = html;
}
function cardHTML(l){
  const its = itemsOf(l.id);
  const total = its.length, checked = its.filter(i=>i.checked).length;
  const open = its.filter(i=>!i.checked).sort((a,b)=>a.order-b.order);
  const prev = total === 0 ? "Lista vazia" : open.length ? open.slice(0,8).map(i=>i.text||"…").join(" · ") : "Tudo no carrinho";
  const cats = [...new Set(open.map(i=>i.cat))].slice(0,8).map(c=>`<i style="--c:${catById(c).color}" title="${esc(catById(c).name)}"></i>`).join("");
  const pct = total ? Math.round(checked/total*100) : 0;
  return `<article class="lcard ${l.done?"done":""}" data-open="${esc(l.id)}" tabindex="0" role="button" aria-label="Abrir ${esc(l.title||"lista sem nome")}">
    <div class="lbody" style="grid-column:1/3"><h2>${esc(l.title || "Lista sem nome")}</h2><p class="prev">${esc(prev)}</p>${cats?`<div class="cats">${cats}</div>`:""}</div>
    <span class="count">${checked}/${total}</span>
    <i class="bar" style="width:${l.done?100:pct}%"></i>
  </article>`;
}

/* list view: reconciliação por chave para não derrubar o foco/teclado enquanto alguém digita */
const liMap = new Map();
const secMap = new Map();
let catsSortable = null;

function renderList(){
  const list = S.lists.get(S.listId);
  if (!list) {
    if (S.mode === "remote" && !S.loaded.lists) return;
    S.view = "home"; S.listId = null; render(); toast("Essa lista foi excluída."); return;
  }
  const ti = $("titleInput");
  if (document.activeElement !== ti && ti.value !== (list.title||"")) ti.value = list.title || "";
  ti.readOnly = S.readonly;

  const its = itemsOf(S.listId);
  const open = its.filter(i=>!i.checked), cart = its.filter(i=>i.checked);
  const animOK = !S.dragging && !(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  const before = new Map();
  const secBefore = new Map();
  if (animOK) {
    for (const [cid, sec] of secMap) if (sec.isConnected) secBefore.set(cid, sec.getBoundingClientRect().top);
    for (const [id, li] of liMap) if (li.isConnected) { const r = li.getBoundingClientRect(); const sr = li.closest(".cat"); if (r.height && sr) before.set(id, {sec: sr.dataset.cat, off: r.top - sr.getBoundingClientRect().top}); }
  }
  $("shopPill").hidden = !shopping.has(S.listId);
  $("progress").textContent = `${cart.length}/${its.length}`;
  $("pbarFill").style.width = (its.length ? cart.length/its.length*100 : 0) + "%";

  // banner
  let banner = "";
  if (S.mode === "local") banner += `<div class="note">Modo local: esta lista está salva só neste aparelho e não sincroniza.</div>`;
  if (S.readonly) banner += `<div class="note">Você pode ver esta lista, mas não editar.</div>`;
  const finished = !!(list.done && its.length && !open.length);
  if (finished && !S.peek) banner += `<div class="finish"><div class="ring">${ICON_CHECK_XL}</div>
      <h2>Compra <em>finalizada.</em></h2>
      <p>${its.length} ${its.length === 1 ? "item riscado" : "itens riscados"}${list.title ? ` em “${esc(list.title)}”` : ""}. Bom proveito!</p>
      <div class="finish-actions">${S.readonly ? "" : '<button class="btn primary" data-act="reuse">Usar a lista de novo</button>'}<button class="btn" data-act="peek">Ver itens riscados</button><button class="btn ghost" data-act="home">Voltar para as listas</button></div>
      ${S.readonly ? "" : '<p class="hint">esqueceu algo? adicione na barra abaixo</p>'}
      ${showFbPrompt() ? '<p class="fb-prompt"><button data-act="fb">Algo poderia ser melhor? Me conta</button><button data-act="fb-x" aria-label="Não mostrar de novo">×</button></p>' : ""}</div>`;
  else if (finished) banner += `<div class="banner"><p><strong>Compra finalizada</strong>Mostrando os itens riscados.</p><button class="btn" data-act="hide-items">Ocultar</button></div>`;
  else if (list.done) banner += `<div class="banner"><p><strong>Lista concluída</strong>Você ainda pode editar, ou reabrir para usar de novo.</p>${S.readonly?"":'<button class="btn primary" data-act="reuse">Usar de novo</button>'}</div>`;
  else if (its.length && !open.length) banner += `<div class="banner"><p><strong>Tudo no carrinho</strong>Concluir manda a lista para “Concluídas”.</p>${S.readonly?"":'<button class="btn primary" data-act="finish">Concluir</button>'}</div>`;
  const bEl = $("listBanner"); if (bEl._html !== banner) { bEl.innerHTML = banner; bEl._html = banner; }
  $("catsWrap").hidden = finished && !S.peek;
  const sgEl = $("suggest");
  const sgHTML = (S.readonly || list.done || sgHidden.has(S.listId)) ? "" : suggestHTML(S.listId, its, list);
  if (sgEl._html !== sgHTML) { sgEl.innerHTML = sgHTML; sgEl._html = sgHTML; }

  $("listEmpty").innerHTML = its.length ? "" : `<div class="empty"><div class="basket">${ICON_BASKET}</div><strong>Lista vazia</strong>${S.readonly?"":"Digite um item na barra de baixo. A categoria é sugerida sozinha: “pão” vai para Padaria, “banana” para Fruteira.<div style=\"margin-top:16px\"><button class=\"btn primary\" data-act=\"focus-add\">Adicionar item</button></div>"}</div>`;

  // seções por categoria
  const wrap = $("catsWrap");
  const order = sortedCatsFor(list);
  const byCat = new Map();
  for (const it of its) { const c = order.includes(it.cat) ? it.cat : "outros"; if (!byCat.has(c)) byCat.set(c, []); byCat.get(c).push(it); }
  const eff = it => hold.has(it.id) ? hold.get(it.id) : !!it.checked;
  const sortSec = arr => arr.sort((a,b) => {
    const ca = eff(a), cb = eff(b);
    if (ca !== cb) return ca ? 1 : -1;
    if (!ca) return (a.order||0) - (b.order||0);
    return (b.checkedAt||0) - (a.checkedAt||0);
  });
  const isDone = cid => byCat.get(cid).every(i => eff(i));
  const present = order.filter(c => byCat.has(c));
  const cats = present.filter(c => !isDone(c)).concat(present.filter(c => isDone(c)));
  const used = new Set();

  cats.forEach((cid, idx) => {
    let sec = secMap.get(cid);
    if (!sec) { sec = makeSection(cid); secMap.set(cid, sec); }
    const cat = catById(cid);
    sec.querySelector("h3").textContent = cat.name;
    sec.querySelector(".sw").style.setProperty("--c", cat.color);
    const arr = sortSec(byCat.get(cid));
    sec.querySelector(".n").textContent = arr.filter(i=>i.checked).length + "/" + arr.length;
    const allDone = arr.every(i => eff(i));
    sec.classList.toggle("all-done", allDone);
    if (!allDone) expanded.delete(cid);
    sec.classList.toggle("collapsed", allDone && !expanded.has(cid));
    if (wrap.children[idx] !== sec) wrap.insertBefore(sec, wrap.children[idx] || null);
    placeItems(sec.querySelector("ul"), arr, false, used);
  });
  for (const [cid, sec] of secMap) if (!cats.includes(cid)) { if (sec._sortable) sec._sortable.destroy(); sec.remove(); secMap.delete(cid); }

  $("cartSec").hidden = true;

  for (const [id, li] of liMap) if (!used.has(id)) { li.remove(); liMap.delete(id); }

  // animação FLIP: seções e itens deslizam da posição antiga para a nova
  const flip = (el, dy) => {
    el.style.transition = "none"; el.style.transform = `translateY(${dy}px)`;
    void el.offsetWidth;
    el.style.transition = "transform .38s cubic-bezier(.2,.8,.2,1)"; el.style.transform = "";
    clearTimeout(el._flipT); el._flipT = setTimeout(() => { el.style.transition = ""; }, 420);
  };
  const secNow = new Map();
  for (const [cid, sec] of secMap) secNow.set(cid, sec.getBoundingClientRect().top);
  for (const [cid, sec] of secMap) { const b = secBefore.get(cid); if (b == null) continue; const dy = b - secNow.get(cid); if (Math.abs(dy) >= 1) flip(sec, dy); }
  if (before.size) for (const [id, li] of liMap) {
    const b = before.get(id); if (b == null) continue;
    const sr = li.closest(".cat"); if (!sr) continue;
    const r = li.getBoundingClientRect(); if (!r.height) continue;
    const nowOff = r.top - secNow.get(sr.dataset.cat);
    const dy = sr.dataset.cat === b.sec ? b.off - nowOff
      : (secBefore.get(b.sec) ?? 0) + b.off - (secBefore.get(sr.dataset.cat) ?? secNow.get(sr.dataset.cat)) - nowOff;
    if (Math.abs(dy) >= 1) flip(li, dy);
  }

  if (!catsSortable && window.Sortable) {
    catsSortable = Sortable.create(wrap, {
      handle: ".cat-grip", draggable: ".cat", animation: 160, ghostClass: "sortable-ghost",
      onChoose(){ wrap.classList.add("reordering"); },
      onUnchoose(){ wrap.classList.remove("reordering"); },
      onStart(){ S.dragging = true; },
      onEnd(){
        S.dragging = false; wrap.classList.remove("reordering");
        const l = S.lists.get(S.listId); if (!l) return render();
        const visible = [...wrap.children].map(s => s.dataset.cat);
        const rest = sortedCatsFor(l).filter(c => !visible.includes(c));
        write("lists", S.listId, {catOrder: visible.concat(rest)}, "patch");
      }
    });
  }
  if (catsSortable) catsSortable.option("disabled", S.readonly);
  updateAddChip();
  renderPeers();
}

function makeSection(cid){
  const sec = document.createElement("section");
  sec.className = "cat"; sec.dataset.cat = cid;
  sec.innerHTML = `<div class="cat-head"><span class="cat-grip" aria-label="Arrastar categoria">${ICON_GRIP}</span><i class="sw"></i><button class="cat-name" aria-label="Editar categoria"><h3></h3>${ICON_PENCIL}</button><span class="n"></span><button class="cat-toggle" aria-label="Mostrar ou esconder itens riscados">${ICON_CHEV}</button></div><ul class="items" data-cat="${esc(cid)}"></ul><button class="add-in-cat">${ICON_PLUS}<span>Adicionar item</span></button>`;
  const ul = sec.querySelector("ul");
  if (window.Sortable) {
    sec._sortable = Sortable.create(ul, {
      group: "items", handle: ".grip", animation: 160, ghostClass: "sortable-ghost", fallbackOnBody: true, filter: ".done", preventOnFilter: false,
      disabled: S.readonly,
      onStart(){ S.dragging = true; },
      onEnd(evt){
        S.dragging = false;
        const li = evt.item, id = li.dataset.id, cat = evt.to.dataset.cat;
        const it = S.items.get(id);
        if (!it) return render();
        let pv = li.previousElementSibling, nx = li.nextElementSibling;
        while (pv && pv.classList.contains("done")) pv = pv.previousElementSibling;
        while (nx && nx.classList.contains("done")) nx = nx.nextElementSibling;
        const po = pv && S.items.get(pv.dataset.id) ? S.items.get(pv.dataset.id).order : null;
        const no = nx && S.items.get(nx.dataset.id) ? S.items.get(nx.dataset.id).order : null;
        let ord = po != null && no != null ? (po+no)/2 : po != null ? po + 1 : no != null ? no - 1 : it.order;
        if (evt.from === evt.to && evt.oldIndex === evt.newIndex) return render();
        const patch = {order: ord};
        if (cat && cat !== it.cat) patch.cat = cat;
        write("items", id, patch, "patch");
        if (patch.cat) learn(it.text, patch.cat);
        if (S.pendingRender) { S.pendingRender = false; render(); }
      }
    });
  }
  return sec;
}

function placeItems(ul, arr, isCart, used){
  arr.forEach((it, idx) => {
    used.add(it.id);
    let li = liMap.get(it.id);
    if (!li) { li = makeLi(it.id); liMap.set(it.id, li); }
    updateLi(li, it, isCart);
    if (ul.children[idx] !== li) ul.insertBefore(li, ul.children[idx] || null);
  });
  // remove sobras que não pertencem mais a esse ul
  [...ul.children].forEach((li, i) => { if (i >= arr.length) { /* será movido ou removido */ if (!arr.some(a => a.id === li.dataset.id)) { if (!used.has(li.dataset.id)) li.remove(); } } });
}
function makeLi(id){
  const li = document.createElement("li");
  li.className = "item"; li.dataset.id = id;
  li.innerHTML = `<span class="grip" aria-hidden="true">${ICON_GRIP}</span>
    <button class="check" role="checkbox" aria-checked="false" aria-label="Riscar item">${ICON_CHECK}</button>
    <input class="txt" data-item-id="${esc(id)}" autocomplete="off" enterkeyhint="next" placeholder="Item" aria-label="Nome do item">
    <span class="tag" hidden><i></i><b></b></span>
    <button class="more" aria-label="Opções do item">${ICON_MORE}</button>`;
  return li;
}
function updateLi(li, it, isCart){
  li.classList.toggle("done", !!it.checked);
  li.classList.toggle("settling", !!it.checked && hold.has(it.id));
  const ck = li.querySelector(".check");
  ck.setAttribute("aria-checked", it.checked ? "true" : "false");
  ck.setAttribute("aria-label", it.checked ? "Desmarcar item" : "Riscar item");
  ck.disabled = S.readonly;
  const inp = li.querySelector(".txt");
  const val = drafts.has(it.id) ? drafts.get(it.id) : (it.text || "");
  if (document.activeElement !== inp && inp.value !== val) inp.value = val;
  inp.readOnly = S.readonly;
  const tag = li.querySelector(".tag");
  tag.hidden = !isCart;
  if (isCart) { const c = catById(it.cat); tag.querySelector("i").style.setProperty("--c", c.color); tag.querySelector("b").textContent = c.name; }
}

/* ---------------- presença ---------------- */
function renderPeers(){
  const el = $("peers");
  const ps = S.peers;
  if (!ps.length) { el.innerHTML = ""; el.onclick = null; return; }
  const nameOf = p => ((S.profiles[p.by] || {}).name) || "Alguém";
  const ini = nm => nm.split(/\s+/).filter(Boolean).map(w => w[0]).join("").slice(0,2).toUpperCase() || "?";
  const shown = ps.length > 3 ? ps.slice(0, 2) : ps;
  const extra = ps.length - shown.length;
  const avs = shown.map(p => `<span class="av" style="--c:${esc((S.profiles[p.by] || {}).color || "#ff6b1a")}">${esc(ini(nameOf(p)))}</span>`).join("")
    + (extra ? `<span class="av more-av">+${extra}</span>` : "");
  const label = ps.length === 1 ? `${nameOf(ps[0])} está nesta lista agora` : `${ps.length} pessoas nesta lista agora`;
  el.innerHTML = `<button class="peer-stack" aria-label="${esc(label)}" title="${esc(label)}">${avs}<i class="live-dot"></i></button>`;
  el.onclick = () => {
    const rows = S.peers.map(p => { const nm = nameOf(p); return `<div class="mrow"><span class="av-sm" style="--c:${esc((S.profiles[p.by] || {}).color || "#ff6b1a")}">${esc(ini(nm))}</span><div class="minfo"><b>${esc(nm)}</b></div></div>`; }).join("");
    openSheet(`<h4>Nesta lista agora</h4><p class="sub">${S.peers.length === 1 ? "1 pessoa" : S.peers.length + " pessoas"} com a lista aberta além de você.</p><div class="mlist">${rows}</div><div class="confirm"><button class="btn" data-act="close">Fechar</button></div>`, body => {
      body.onclick = e => { if (e.target.closest('[data-act="close"]')) closeSheet(); };
    });
  };
}
function setupRoom(){
  const r = S.room;
  const refresh = (peers) => {
    const seen = new Set();
    S.peers = peers.filter(p => !p.isMe && p.kind === "viewer" && p.presence && p.presence.list === S.listId && S.listId && p.by && !seen.has(p.by) && seen.add(p.by));
    const ids = S.peers.map(p => p.by).filter(id => !S.profiles[id]);
    if (ids.length && S.userApi && S.userApi.profiles) {
      S.userApi.profiles(ids).then(ps => { Object.assign(S.profiles, ps || {}); renderPeers(); }).catch(()=>{});
    }
    renderPeers();
  };
  try { r.onPeers(ch => refresh(ch.peers), () => {}); } catch(e){}
  S._refreshPeers = () => { try { refresh(r.peers()); } catch(e){} };
  announce();
}

  const its = itemsOf(listId);

  return pool.length ? Math.max(...pool.map(i => i.order || 0)) + 1 : 1;
}

/* ---------------- voz ---------------- */
let voiceRec = null;
function startVoice(){
  const btn = $("addBtn"), inp = $("addInput");
  if (voiceRec) { try { voiceRec.stop(); } catch(e){} return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    try {
      const base = inp.value.trim();
      const r = new SR(); voiceRec = r; let failed = false, heard = false;
      // se nada for ouvido em alguns segundos (microfone bloqueado em silêncio), cai na dica do teclado
      const guard = setTimeout(() => { if (!heard && voiceRec === r) { failed = true; try { r.abort(); } catch(e){} } }, 5000);
      r.lang = "pt-BR"; r.interimResults = true; r.continuous = false;
      r.onresult = e => { heard = true; let t = ""; for (const res of e.results) t += res[0].transcript; inp.value = (base ? base + ", " : "") + t.trim(); updateAddChip(); btn.classList.add("listening"); };
      r.onerror = () => { failed = true; };
      r.onend = () => { clearTimeout(guard); if (voiceRec !== r) return; voiceRec = null; btn.classList.remove("listening"); if (failed && !heard) voiceFallback(); else if (inp.value.trim()) submitAdd(); };
      btn.classList.add("listening"); r.start(); return;
    } catch(e){ voiceRec = null; }
  }
  voiceFallback();
}
function voiceFallback(){
  $("addBtn").classList.remove("listening");
  $("addInput").focus();
  toast("Aqui no Claude, use o microfone do teclado para ditar. No app instalado, este botão grava direto.");
}

/* ---------------- sugestões: aprende o ritmo de compra de cada item ---------------- */
const sgHidden = new Set();
let currentSuggestions = [];
function logTrip(listId){
  if (S.readonly) return;
  const bought = itemsOf(listId).filter(i => i.checked && (i.text||"").trim());
  if (!bought.length) return;
  const id = (listId + "-" + Date.now().toString(36)).slice(0, 190);
  write("history", id, {listId, at: Date.now(), items: bought.map(i => ({k: keyOf(i.text), text: i.text, cat: i.cat})).filter(x => x.k)}, "set");
}
function pastTrips(currentListId){
  const trips = [], logged = new Set();
  for (const h of S.history.values()) {
    if (!h || !Array.isArray(h.items)) continue;
    logged.add(h.listId);
    trips.push({at: h.at || 0, items: h.items});
  }
  // listas antigas com itens riscados que nunca foram concluídas também contam como uma compra
  for (const [lid, l] of S.lists) {
    if (lid === currentListId || logged.has(lid)) continue;
    const bought = itemsOf(lid).filter(i => i.checked && (i.text||"").trim());
    if (!bought.length) continue;
    trips.push({at: l.createdAt || 0, items: bought.map(i => ({k: keyOf(i.text), text: i.text, cat: i.cat}))});
  }
  return trips.sort((a, b) => a.at - b.at);
}
function computeSuggestions(listId, its, list){
  const trips = pastTrips(listId);
  const N = trips.length;
  if (N < 2) return [];
  const stats = new Map();
  trips.forEach((t, idx) => {
    const seen = new Set();
    for (const it of t.items) {
      if (!it || !it.k || seen.has(it.k)) continue; seen.add(it.k);
      let s = stats.get(it.k); if (!s) { s = {idx: [], text: it.text, cat: it.cat}; stats.set(it.k, s); }
      s.idx.push(idx); s.text = it.text; s.cat = it.cat;
    }
  });
  const inList = new Set(its.map(i => keyOf(i.text)));
  const dismissed = new Set((list && list.dismissed) || []);
  const out = [];
  for (const [k, s] of stats) {
    if (s.idx.length < 2 || inList.has(k) || dismissed.has(k)) continue;
    const gaps = []; for (let i = 1; i < s.idx.length; i++) gaps.push(s.idx[i] - s.idx[i-1]);
    gaps.sort((a, b) => a - b);
    const interval = Math.max(1, Math.round(gaps[Math.floor(gaps.length / 2)]));
    const since = N - s.idx[s.idx.length - 1];
    if (since < interval) continue;
    let why = interval === 1 ? "em toda compra" : interval === 2 ? "compra sim, compra não" : `a cada ${interval} compras`;
    if (since > interval) why = `costuma ser ${why.replace("em toda compra", "toda compra")} · atrasado`;
    out.push({key: k, text: s.text, cat: allCats().some(c => c.id === s.cat) ? s.cat : (guessCat(s.text) || "outros"), why, score: since / interval + s.idx.length / N});
  }
  return out.sort((a, b) => b.score - a.score).slice(0, 14);
}
function suggestHTML(listId, its, list){
  currentSuggestions = computeSuggestions(listId, its, list);
  if (!currentSuggestions.length) return "";
  const chips = currentSuggestions.map(sg => `<span class="sg-chip"><button class="sg-add" data-sg="${esc(sg.key)}" aria-label="Adicionar ${esc(sg.text)}">${ICON_PLUS}<span><b>${esc(sg.text)}</b><small>${esc(sg.why)}</small></span></button><button class="sg-x" data-sg-x="${esc(sg.key)}" aria-label="Não preciso de ${esc(sg.text)} desta vez">×</button></span>`).join("");
  return `<div class="suggest"><div class="sg-head"><span class="sg-title"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>você deve precisar de…</span>${currentSuggestions.length > 1 ? '<button data-act="sg-all">Adicionar todos</button>' : ""}<button data-act="sg-hide">Ocultar</button></div><div class="sg-chips">${chips}</div></div>`;
}

async function joinEnv(code){
  const id = cleanCode(code);
  if (id.length < 8) { toast("Link de convite inválido. Confira e tente de novo."); return false; }
  if (P.envs.some(e => e.id === id)) { switchEnv(id); toast(`Agora em “${envName(id)}”`); return true; }

      name = (snap.data() || {}).name || name;

function subscribeEnv(){

    S.items = new Map(snap.docs.map(d => [d.id, {...d.data()}]));

  }), onErr));
  unsubs.push(db.collection(envPath("history")).onSnapshot(live(snap => {

function ensureMember(){

async function sendFeedback(kind, text, from){

    await S.db.doc(`feedback/${S.myId}/msgs/${id}`).set({kind, text, at: Date.now(), ctx});

  if (!S.env) switchEnv(P.current && P.envs.some(e => e.id === P.current) ? P.current : P.envs[0].id);
  S.bootDone = true; routeFromHash(); render();
}
function routeFromHash(){
  const m = /^#l-(.+)$/.exec(location.hash || "");
  if (m && S.lists.has(m[1])) openList(m[1]);
}

render();
(async function boot(){
  const c = window.claude;
  if (!c || typeof c.use !== "function") { startLocal(); return; }
  let db = null;
  try { db = await c.use("db"); } catch(e){}
  if (!db) { startLocal(); return; }
  S.mode = "remote"; S.db = db; render();
  let u = null;
  try { u = await c.use("user"); } catch(e){}
  if (u) {
    S.userApi = u;
    try { S.myId = await u.id(); } catch(e){}
    try { const w = await u.can("data.write"); if (w === false) S.readonly = true; } catch(e){}
    try { const me = await u.me(); S.meName = (me && me.name) || ""; S.meColor = (me && me.color) || ""; } catch(e){}
    try { S.isOwner = await u.isOwner(); } catch(e){}
  }
  await loadProfile();
  const inv = /^#e-([A-Za-z0-9]+)$/.exec(location.hash || "");
  if (!P.envs.length && !S.readonly) {
    let owner = false; try { owner = u ? await u.isOwner() : false; } catch(e){}
    let legacy = false;
    if (owner) { try { legacy = !(await db.collection("lists").limit(1).get()).empty; } catch(e){} }
    if (legacy || !inv) {
      S.migrating = legacy; render();
      const id = await createEnv("Minha casa");
      if (id && legacy) await migrateLegacy(db, id);
      S.migrating = false;
    }
  }
  if (inv) { await joinEnv(inv[1]); }
  if (!P.envs.length && !S.readonly) await createEnv("Minha casa");
  if (!S.env && P.envs.length) switchEnv(P.current && P.envs.some(e => e.id === P.current) ? P.current : P.envs[0].id);
  S.bootDone = true; render();
  afterBootFeedback();
  c.use("room").then(r => { if (r) { S.room = r; setupRoom(); } }).catch(()=>{});
})();
})();
</script>
