# Gera o APK a cada push na main (ou manualmente).
# Com os segredos KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS e KEY_PASSWORD: APK de release assinado.
# Sem eles: APK de debug, para o build funcionar mesmo assim.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Decidir entre release e debug
        id: tipo
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$RUNNER_TEMP/release.jks"
            echo "tipo=release" >> "$GITHUB_OUTPUT"
          else
            echo "tipo=debug" >> "$GITHUB_OUTPUT"
            echo "::warning title=APK sem a chave de release::Segredos de assinatura ausentes (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). Gerando APK de debug, assinado com uma chave que muda a cada execução: quem testa NÃO vai conseguir atualizar por cima da versão anterior (precisa desinstalar antes). Rode o workflow Gerar keystore e crie os 4 segredos."
          fi

      - name: Gradle (release assinado)
        if: steps.tipo.outputs.tipo == 'release'
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Gradle (debug)
        if: steps.tipo.outputs.tipo == 'debug'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renomear o APK e mostrar o SHA-1 da chave
        env:
          TIPO: ${{ steps.tipo.outputs.tipo }}
        run: |
          set -euo pipefail
          DEST="lista-da-feira-${{ github.run_number }}-$TIPO.apk"
          cp "android/app/build/outputs/apk/$TIPO/app-$TIPO.apk" "$DEST"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          echo "APK: $DEST ($TIPO)"
          "$BT/apksigner" verify --print-certs "$DEST" | grep -E 'SHA-1|SHA-256'
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: lista-da-feira
          path: lista-da-feira-*.apk
          if-no-files-found: error

      - name: Verificar segredos do Firebase
        id: firebase
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_APP_ID" ] && [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "enviar=true" >> "$GITHUB_OUTPUT"
            # notas da versão: a mensagem do último commit (sem a linha de co-autoria)
            git log -1 --pretty=%B | grep -v '^Co-Authored-By:' > notas.txt
          else
            echo "::notice::Segredos FIREBASE_APP_ID/FIREBASE_SERVICE_ACCOUNT ausentes: pulando o envio ao Firebase App Distribution."
          fi

      - name: Enviar ao Firebase App Distribution (grupo amigos)
        if: steps.firebase.outputs.enviar == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1.7.1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: amigos
          file: lista-da-feira-${{ github.run_number }}-${{ steps.tipo.outputs.tipo }}.apk
          releaseNotesFile: notas.txt
