# Gera a keystore de release do app. Rode só uma vez, manualmente (Actions → Gerar keystore → Run workflow).
# Baixe o artefato, crie os 4 segredos do repositório e guarde a keystore em local seguro.
# O artefato some em 1 dia; sem a keystore não dá para atualizar o app no Google Play.
name: Gerar keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Gerar a keystore
        run: |
          set -euo pipefail
          # Keystore PKCS12 (padrão do keytool): a senha da chave é a mesma da keystore.
          PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$PASS"
          mkdir -p saida
          keytool -genkeypair \
            -keystore saida/listadafeira-release.jks -storetype PKCS12 \
            -alias listadafeira -keyalg RSA -keysize 4096 -validity 10950 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Lista da Feira, O=Lista da Feira, C=BR"
          base64 -w0 saida/listadafeira-release.jks > saida/KEYSTORE_BASE64.txt
          {
            echo "Lista da Feira - keystore de release"
            echo "Gerada em: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "Segredos do GitHub (Settings > Secrets and variables > Actions):"
            echo "KEYSTORE_BASE64   = conteúdo do arquivo KEYSTORE_BASE64.txt"
            echo "KEYSTORE_PASSWORD = $PASS"
            echo "KEY_ALIAS         = listadafeira"
            echo "KEY_PASSWORD      = $PASS"
            echo
            echo "A keystore é PKCS12, então a senha da chave é igual à da keystore."
            echo "Guarde o .jks e este arquivo num gerenciador de senhas. Sem eles não dá para atualizar o app."
          } > saida/credenciais.txt

      - name: Mostrar as impressões digitais do certificado
        run: |
          PASS="$(grep '^KEYSTORE_PASSWORD' saida/credenciais.txt | sed 's/.*= //')"
          keytool -list -v -keystore saida/listadafeira-release.jks -alias listadafeira -storepass "$PASS" \
            | grep -E '^\s*SHA(1|256):'

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-lista-da-feira
          path: saida/
          retention-days: 1
          if-no-files-found: error
